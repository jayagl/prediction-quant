[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-quant"
version = "0.1.0"
description = "Quantitative trading bot for prediction markets"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "numpy>=1.26,<3",
    "click>=8.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.4,<1",
]

[project.scripts]
prediction-quant = "prediction_quant.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
